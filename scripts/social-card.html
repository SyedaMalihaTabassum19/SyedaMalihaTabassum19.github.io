<!doctype html>
<!--
  Template for public/og/default.png (the image shown when a link to the site
  is shared on LinkedIn, Slack, etc.). This file is NOT deployed.

  Regenerate after changing the name or headline (Chrome must be installed):
    "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --hide-scrollbars ^
      --window-size=1200,630 --screenshot="%CD%\public\og\default.png" "%CD%\scripts\social-card.html"
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400&family=Instrument+Sans:wght@500&family=JetBrains+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #f8f4ea; color: #0d3236; font-family: 'Instrument Sans', system-ui, sans-serif;
        display: grid; grid-template-columns: 1fr 430px; align-items: center; padding: 0 0 0 84px; box-sizing: border-box;
        background-image: radial-gradient(70% 90% at 92% 10%, rgb(10 110 80 / 0.12), transparent 60%);
      }
      .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: #0a6e50; }
      h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 104px; line-height: .92; letter-spacing: -.035em; margin: 26px 0 30px; }
      h1 em { display: block; color: #0a6e50; }
      p { font-family: 'Fraunces', Georgia, serif; font-size: 32px; line-height: 1.25; margin: 0; max-width: 18em; }
      .rule { width: 72px; height: 3px; background: #0a6e50; margin-top: 36px; }
      svg { width: 430px; height: 630px; }
    </style>
  </head>
  <body>
    <div>
      <div class="eyebrow">AI Researcher · BRAC University CSE</div>
      <h1>Syeda Maliha <em>Tabassum</em></h1>
      <p>Multimodal AI, agentic systems and reliable decision-making.</p>
      <div class="rule"></div>
    </div>
    <svg viewBox="0 0 430 630" aria-hidden="true">
      <g fill="#0d3236" opacity=".18">
        <circle cx="40" cy="80" r="1.6"/><circle cx="80" cy="80" r="1.6"/><circle cx="120" cy="80" r="1.6"/><circle cx="160" cy="80" r="1.6"/><circle cx="200" cy="80" r="1.6"/><circle cx="240" cy="80" r="1.6"/><circle cx="280" cy="80" r="1.6"/><circle cx="320" cy="80" r="1.6"/><circle cx="360" cy="80" r="1.6"/>
        <circle cx="40" cy="550" r="1.6"/><circle cx="80" cy="550" r="1.6"/><circle cx="120" cy="550" r="1.6"/><circle cx="160" cy="550" r="1.6"/><circle cx="200" cy="550" r="1.6"/><circle cx="240" cy="550" r="1.6"/><circle cx="280" cy="550" r="1.6"/><circle cx="320" cy="550" r="1.6"/><circle cx="360" cy="550" r="1.6"/>
      </g>
      <g fill="none" stroke="#0a6e50">
        <circle cx="70" cy="470" r="30" opacity=".5"/><circle cx="70" cy="470" r="60" opacity=".3"/><circle cx="70" cy="470" r="90" opacity=".15"/>
        <path d="M70 470 L200 290 L200 420 Z" fill="rgb(10 110 80 / .12)" stroke="none"/>
        <path d="M70 470 L200 290 M70 470 L200 420" stroke-dasharray="3 5"/>
      </g>
      <g fill="none" stroke="#0d3236" stroke-width="1.6">
        <path d="M245 255 H335 V345 H245 Z" stroke-dasharray="4 4" opacity=".5"/>
        <path d="M200 290 L245 255 M290 290 L335 255 M290 420 L335 345 M200 420 L245 345" opacity=".6"/>
        <path d="M200 290 H290 V420 H200 Z" fill="#fffdf8"/>
      </g>
      <path d="M70 470 C 160 380, 220 330, 260 230 S 300 160, 330 150" fill="none" stroke="#0a6e50" stroke-width="3" stroke-linecap="round"/>
      <circle cx="330" cy="150" r="22" fill="none" stroke="#0a6e50" opacity=".4"/>
      <circle cx="330" cy="150" r="10" fill="#0a6e50"/>
      <circle cx="70" cy="470" r="9" fill="#0a6e50" stroke="#f8f4ea" stroke-width="4"/>
    </svg>
  </body>
</html>
